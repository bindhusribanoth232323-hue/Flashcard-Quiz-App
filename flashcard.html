<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcard Quiz App</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f4f6f9;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:450px;
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
    margin-bottom:20px;
    color:#333;
}

.flashcard{
    border:2px solid #ddd;
    border-radius:10px;
    padding:25px;
    text-align:center;
    min-height:180px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.question{
    font-size:22px;
    font-weight:bold;
    color:#222;
}

.answer{
    margin-top:15px;
    color:#007bff;
    font-size:18px;
    display:none;
}

button{
    padding:10px 15px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    margin:5px;
    color:white;
}

.show-btn{ background:#28a745; }
.prev-btn{ background:#6c757d; }
.next-btn{ background:#007bff; }
.edit-btn{ background:#ffc107; color:black; }
.delete-btn{ background:#dc3545; }

.controls,
.actions{
    margin-top:15px;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
}

.form{
    margin-top:20px;
}

input{
    width:100%;
    padding:10px;
    margin-bottom:10px;
    border:1px solid #ccc;
    border-radius:6px;
}

.add-btn{
    width:100%;
    background:#17a2b8;
}
</style>
</head>
<body>

<div class="container">
    <h1>Flashcard Quiz App</h1>

    <div class="flashcard">
        <div class="question" id="question"></div>
        <div class="answer" id="answer"></div>
    </div>

    <div class="controls">
        <button class="show-btn" onclick="toggleAnswer()">Show Answer</button>
    </div>

    <div class="actions">
        <button class="prev-btn" onclick="prevCard()">Previous</button>
        <button class="next-btn" onclick="nextCard()">Next</button>
        <button class="edit-btn" onclick="editCard()">Edit</button>
        <button class="delete-btn" onclick="deleteCard()">Delete</button>
    </div>

    <div class="form">
        <input type="text" id="newQuestion" placeholder="Enter Question">
        <input type="text" id="newAnswer" placeholder="Enter Answer">
        <button class="add-btn" onclick="addCard()">Add Flashcard</button>
    </div>
</div>

<script>
let flashcards = [
    {
        question: "What is HTML?",
        answer: "HyperText Markup Language"
    },
    {
        question: "What is CSS?",
        answer: "Cascading Style Sheets"
    },
    {
        question: "What is JavaScript?",
        answer: "Programming language for web interactivity"
    }
];

let currentIndex = 0;

function displayCard() {
    document.getElementById("question").textContent =
        flashcards[currentIndex].question;

    document.getElementById("answer").textContent =
        flashcards[currentIndex].answer;

    document.getElementById("answer").style.display = "none";
}

function toggleAnswer() {
    const answer = document.getElementById("answer");

    if(answer.style.display === "none"){
        answer.style.display = "block";
    } else {
        answer.style.display = "none";
    }
}

function nextCard() {
    if(flashcards.length === 0) return;

    currentIndex = (currentIndex + 1) % flashcards.length;
    displayCard();
}

function prevCard() {
    if(flashcards.length === 0) return;

    currentIndex =
        (currentIndex - 1 + flashcards.length) %
        flashcards.length;

    displayCard();
}

function addCard() {
    const question =
        document.getElementById("newQuestion").value.trim();

    const answer =
        document.getElementById("newAnswer").value.trim();

    if(question === "" || answer === ""){
        alert("Please enter both question and answer.");
        return;
    }

    flashcards.push({
        question,
        answer
    });

    document.getElementById("newQuestion").value = "";
    document.getElementById("newAnswer").value = "";

    currentIndex = flashcards.length - 1;
    displayCard();
}

function editCard() {
    let newQuestion = prompt(
        "Edit Question:",
        flashcards[currentIndex].question
    );

    if(newQuestion === null) return;

    let newAnswer = prompt(
        "Edit Answer:",
        flashcards[currentIndex].answer
    );

    if(newAnswer === null) return;

    flashcards[currentIndex].question = newQuestion;
    flashcards[currentIndex].answer = newAnswer;

    displayCard();
}

function deleteCard() {
    if(flashcards.length === 0) return;

    let confirmDelete =
        confirm("Delete this flashcard?");

    if(!confirmDelete) return;

    flashcards.splice(currentIndex, 1);

    if(flashcards.length === 0){
        document.getElementById("question").textContent =
            "No Flashcards Available";
        document.getElementById("answer").textContent = "";
        return;
    }

    if(currentIndex >= flashcards.length){
        currentIndex = flashcards.length - 1;
    }

    displayCard();
}

displayCard();
</script>

</body>
</html>
